<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="32" height="32">
  <title>agent-tabs</title>
  <!-- Simplified mark for 16/32 px. Geometry sits on an 8-unit grid (1 px at 16 px). -->
  <defs>
    <rect id="badge" x="64" y="0" width="56" height="56" rx="14"/>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <use href="#badge" fill="#000" stroke="#000" stroke-width="16"/>
    </mask>
  </defs>
  <g mask="url(#cut)">
    <rect x="8" y="32" width="104" height="24" rx="8" fill="#1E88FF"/>
  </g>
  <rect x="8" y="64" width="104" height="24" rx="8" fill="#2DB37A"/>
  <rect x="8" y="96" width="104" height="24" rx="8" fill="#FF8A24"/>
  <use href="#badge" fill="#111"/>
  <rect x="88" y="4" width="8" height="16" rx="4" fill="#fff"/>
  <rect x="72" y="16" width="40" height="32" rx="8" fill="#fff"/>
  <rect x="80" y="24" width="8" height="16" rx="4" fill="#111"/>
  <rect x="96" y="24" width="8" height="16" rx="4" fill="#111"/>
</svg>
