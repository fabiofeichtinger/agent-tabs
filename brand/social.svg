<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <rect width="1280" height="640" fill="#F6F8FB"/>
  <svg x="110" y="160" width="320" height="320" viewBox="0 0 128 128">
  <defs>
    <!-- Tab shapes (stacked: blue on top, green, orange at the back) -->
    <path id="blue" d="M22 36H96A10 10 0 0 1 106 46V80A10 10 0 0 1 96 90H72V68A4 4 0 0 0 68 64H22A10 10 0 0 1 12 54V46A10 10 0 0 1 22 36Z"/>
    <rect id="green" x="12" y="52" width="80" height="38" rx="10"/>
    <rect id="badge" x="80" y="8" width="38" height="38" rx="11"/>
    <!-- 3px transparent gaps between overlapping shapes -->
    <mask id="cut-blue" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <use href="#badge" fill="#000" stroke="#000" stroke-width="7"/>
    </mask>
    <mask id="cut-green" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <use href="#blue" fill="#000" stroke="#000" stroke-width="6"/>
    </mask>
    <mask id="cut-orange" maskUnits="userSpaceOnUse" x="0" y="0" width="128" height="128">
      <rect width="128" height="128" fill="#fff"/>
      <use href="#blue" fill="#000" stroke="#000" stroke-width="6"/>
      <use href="#green" fill="#000" stroke="#000" stroke-width="6"/>
    </mask>
  </defs>

  <g transform="translate(-1 2)">
  <!-- orange tab -->
  <g mask="url(#cut-orange)">
    <rect x="12" y="78" width="94" height="38" rx="10" fill="#FF8A24"/>
  </g>
  <circle cx="24" cy="103" r="4" fill="#fff"/>
  <rect x="33" y="100" width="22" height="6" rx="3" fill="#fff"/>

  <!-- green tab -->
  <g mask="url(#cut-green)">
    <use href="#green" fill="#2DB37A"/>
  </g>
  <circle cx="24" cy="77" r="4" fill="#fff"/>
  <rect x="33" y="74" width="22" height="6" rx="3" fill="#fff"/>

  <!-- blue tab (front) -->
  <g mask="url(#cut-blue)">
    <use href="#blue" fill="#1E88FF"/>
    <circle cx="24" cy="50" r="4" fill="#fff"/>
    <rect x="33" y="47" width="18" height="6" rx="3" fill="#fff"/>
    <rect x="55" y="47" width="22" height="6" rx="3" fill="#fff"/>
  </g>

  <!-- agent badge -->
  <use href="#badge" fill="#111"/>
  <g fill="#fff">
    <circle cx="99" cy="15.5" r="2.3"/>
    <rect x="98.2" y="16.5" width="1.6" height="4.5"/>
    <rect x="84.5" y="26" width="3" height="8" rx="1.5"/>
    <rect x="110.5" y="26" width="3" height="8" rx="1.5"/>
    <rect x="88" y="20.5" width="22" height="19" rx="6"/>
  </g>
  <circle cx="94" cy="30" r="2.6" fill="#111"/>
  <circle cx="104" cy="30" r="2.6" fill="#111"/>
  </g>
  </svg>
  <text x="480" y="315" font-family="Be Vietnam Pro" font-weight="700" font-size="100" fill="#111" letter-spacing="-2">agent-tabs</text>
  <text x="484" y="385" font-family="Be Vietnam Pro" font-weight="400" font-size="31" fill="#3C4043">Let AI agents manage your Chrome tabs.</text>
  <text x="484" y="430" font-family="Be Vietnam Pro" font-weight="400" font-size="31" fill="#5F6368">Native messaging, tabs-only permissions.</text>
</svg>
